<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>

<body>

  <header class="site-head">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand-mark">TIC&#8209;VLA</span>
        <span class="brand-sub">on SerBot&nbsp;II</span>
      </a>
      <nav>
        <a href="{{ '/' | relative_url }}">일지</a>
        <a href="{{ '/todo/' | relative_url }}">할 일</a>
        <a href="{{ '/dataset/' | relative_url }}">데이터셋</a>
        <a href="{{ '/about/' | relative_url }}">프로젝트</a>
        <a href="{{ site.repository_url }}" rel="noopener">원본 논문 코드</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-foot">
    <div class="wrap">
      <p>{{ site.author }} · {{ site.affiliation }}</p>
      <p class="muted">이 사이트의 수치는 실제 로봇에서 측정한 값입니다. 재현 환경이 다르면 결과가 달라질 수 있습니다.</p>
    </div>
  </footer>

</body>

</html>
